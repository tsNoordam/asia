[project]
name = "asiabt"
version = "0.1.0"
description = "Research backtester for Nasdaq-100 futures Asian-session range strategies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "requests>=2.31", "yfinance>=0.2.40", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asiabt"]
